name: Signed revision release

on:
  push:
    tags:
      - "revision-*"

jobs:
  release:
    runs-on: [ubuntu-latest]
    # Forgejo's JavaScript actions (checkout/upload-artifact) require Node.
    # The ubuntu-latest runner currently launches an ubuntu:24.04 container,
    # which does not provide it by default.
    container: node:22-bookworm
    timeout-minutes: 360
    steps:
      - name: Check out tagged source
        uses: https://data.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          printf 'Dependency installation UID: %s\n' "$(id -u)"
          test "$(id -u)" -eq 0
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update
          apt-get -qq install -y --no-install-recommends \
            bc build-essential ca-certificates cpio file flake8 git \
            gnupg jq libncurses-dev libssl-dev mtools patch perl \
            python3 python3-magic qemu-utils rsync shellcheck unzip wget \
            xz-utils zstd

      - name: Validate tag and derive release metadata
        id: version
        shell: bash
        env:
          # Use the Forgejo context explicitly; older runner builds have not
          # always exported the compatible GITHUB_REF_NAME alias to shells.
          QBTOS_REF_NAME: ${{ forgejo.ref_name }}
        run: |
          set -euo pipefail
          ref_name="${QBTOS_REF_NAME:-${FORGEJO_REF_NAME:-${GITHUB_REF_NAME:-}}}"
          if [[ -z "$ref_name" ]]; then
            event_ref="${FORGEJO_REF:-${GITHUB_REF:-}}"
            ref_name="${event_ref##*/}"
          fi
          if [[ -z "$ref_name" ]]; then
            ref_name="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"
          fi
          environment_file="${FORGEJO_ENV:-${GITHUB_ENV:-}}"
          printf 'Release ref: %s\n' "$ref_name"
          if [[ -z "$environment_file" ]]; then
            echo 'Forgejo environment command file is unavailable' >&2
            exit 1
          fi
          [[ "$ref_name" =~ ^revision-[1-9][0-9]*$ ]] || {
            echo "Invalid release tag: $ref_name" >&2
            exit 1
          }
          eval "$(./build-scripts/release-version.sh)"
          [[ "$SOURCE_TAG" == "$ref_name" ]] || {
            echo "Pushed tag $ref_name is not the highest revision reachable from HEAD" >&2
            exit 1
          }
          {
            printf 'BUILD_DATE=%s\n' "$BUILD_DATE"
            printf 'REVISION=%s\n' "$REVISION"
            printf 'VERSION=%s\n' "$VERSION"
            printf 'SOURCE_TAG=%s\n' "$SOURCE_TAG"
            printf 'COMMIT=%s\n' "$COMMIT"
          } >> "$environment_file"

      - name: Materialize signing secrets
        shell: bash
        env:
          RAUC_CERT_PEM: ${{ secrets.RAUC_CERT_PEM }}
          RAUC_KEY_PEM: ${{ secrets.RAUC_KEY_PEM }}
          CI_KEY: ${{ secrets.CI_KEY }}
          CI_TRUSTED_PUBLIC_KEYS: ${{ secrets.CI_TRUSTED_PUBLIC_KEYS }}
        run: |
          set -euo pipefail
          for required_secret in RAUC_CERT_PEM RAUC_KEY_PEM CI_KEY; do
            if [[ -z "${!required_secret:-}" ]]; then
              printf 'Missing required Forgejo secret: %s\n' "$required_secret" >&2
              exit 1
            fi
          done
          printf 'Required signing secrets are present (values withheld).\n'
          install -m 0600 /dev/null "$RUNNER_TEMP/rauc-release.crt"
          install -m 0600 /dev/null "$RUNNER_TEMP/rauc-release.key"
          printf '%s\n' "$RAUC_CERT_PEM" > "$RUNNER_TEMP/rauc-release.crt"
          printf '%s\n' "$RAUC_KEY_PEM" > "$RUNNER_TEMP/rauc-release.key"

          gnupg_home="$RUNNER_TEMP/qbtos-release-gnupg"
          install -d -m 0700 "$gnupg_home"
          key_file="$gnupg_home/release-signing-key"
          install -m 0600 /dev/null "$key_file"
          case "$CI_KEY" in
            *'-----BEGIN PGP PRIVATE KEY BLOCK-----'*)
              printf '%s' "$CI_KEY" > "$key_file"
              ;;
            *)
              if ! printf '%s' "$CI_KEY" | base64 --decode > "$key_file"; then
                echo 'CI_KEY is neither an armored nor valid base64 OpenPGP key' >&2
                exit 1
              fi
              ;;
          esac
          if ! GNUPGHOME="$gnupg_home" gpg --batch --import "$key_file"; then
            echo 'CI_KEY did not contain importable OpenPGP key material' >&2
            exit 1
          fi
          rm -f "$key_file"

          mapfile -t signing_fingerprints < <(
            GNUPGHOME="$gnupg_home" gpg --batch --with-colons \
              --list-secret-keys | \
              awk -F: '$1 == "sec" { primary = 1; next }
                primary && $1 == "fpr" { print $10; primary = 0 }'
          )
          if [[ "${#signing_fingerprints[@]}" -ne 1 ]]; then
            echo 'CI_KEY must contain exactly one primary OpenPGP secret key' >&2
            exit 1
          fi
          fingerprint="${signing_fingerprints[0]}"
          if [[ ! "$fingerprint" =~ ^[0-9A-Fa-f]{40,64}$ ]]; then
            echo 'CI_KEY produced an invalid OpenPGP fingerprint' >&2
            exit 1
          fi

          if [[ -n "$CI_TRUSTED_PUBLIC_KEYS" ]]; then
            if ! printf '%s' "$CI_TRUSTED_PUBLIC_KEYS" | \
              GNUPGHOME="$gnupg_home" gpg --batch --import; then
              echo 'CI_TRUSTED_PUBLIC_KEYS is not importable OpenPGP data' >&2
              exit 1
            fi
          fi

          GNUPGHOME="$gnupg_home" gpg --batch --export \
            > "$RUNNER_TEMP/qbtos-update-signing.gpg"
          [[ -s "$RUNNER_TEMP/qbtos-update-signing.gpg" ]]
          {
            printf 'QBTOS_GNUPGHOME=%s\n' "$gnupg_home"
            printf 'QBTOS_GPG_FINGERPRINT=%s\n' "$fingerprint"
            printf 'QBTOS_GPG_KEYRING_FILE=%s\n' \
              "$RUNNER_TEMP/qbtos-update-signing.gpg"
          } >> "${FORGEJO_ENV:-${GITHUB_ENV}}"

      - name: Check and build signed release
        shell: bash
        run: |
          set -euo pipefail
          build_user=node
          workspace="$(pwd -P)"
          build_uid="$(id -u "$build_user")"
          test "$build_uid" -ne 0

          chown -R "$build_user:$build_user" "$workspace"
          chgrp "$build_user" "$RUNNER_TEMP"
          chmod g+x "$RUNNER_TEMP"
          for signing_file in \
            "$RUNNER_TEMP/rauc-release.crt" \
            "$RUNNER_TEMP/rauc-release.key" \
            "$QBTOS_GPG_KEYRING_FILE"; do
            test -s "$signing_file"
            chown "$build_user:$build_user" "$signing_file"
            chmod 0600 "$signing_file"
            test "$(stat -c '%a' "$signing_file")" = 600
          done

          # Expansion inside this script must occur after runuser changes UID.
          # shellcheck disable=SC2016
          runuser --user "$build_user" -- env \
            HOME="/home/$build_user" USER="$build_user" LOGNAME="$build_user" \
            PATH="$PATH" QBTOS_WORKSPACE="$workspace" \
            VERSION="$VERSION" BUILD_DATE="$BUILD_DATE" REVISION="$REVISION" \
            SOURCE_TAG="$SOURCE_TAG" COMMIT="$COMMIT" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            QBTOS_BUILD_QUIET=1 \
            RAUC_CERT_FILE="$RUNNER_TEMP/rauc-release.crt" \
            RAUC_KEY_FILE="$RUNNER_TEMP/rauc-release.key" \
            QBTOS_GPG_KEYRING_FILE="$QBTOS_GPG_KEYRING_FILE" \
            bash -c '
              set -euo pipefail
              cd "$QBTOS_WORKSPACE"
              printf "Build UID: %s\n" "$(id -u)"
              test "$(id -u)" -ne 0
              test -r "$RAUC_CERT_FILE"
              test -r "$RAUC_KEY_FILE"
              test -r "$QBTOS_GPG_KEYRING_FILE"
              make --silent --no-print-directory check
              make --silent --no-print-directory release \
                VERSION="$VERSION" BUILD_DATE="$BUILD_DATE" \
                REVISION="$REVISION" SOURCE_TAG="$SOURCE_TAG" COMMIT="$COMMIT" \
                RAUC_CERT_FILE="$RAUC_CERT_FILE" RAUC_KEY_FILE="$RAUC_KEY_FILE" \
                QBTOS_GPG_KEYRING_FILE="$QBTOS_GPG_KEYRING_FILE"
            '

      - name: Sign and verify release checksums
        shell: bash
        env:
          CI_KEY_PASSPHRASE: ${{ secrets.CI_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          [[ -n "$CI_KEY_PASSPHRASE" ]]
          unsigned_checksums="$RUNNER_TEMP/$VERSION.sha256.unsigned"
          mv "dist/$VERSION.sha256" "$unsigned_checksums"
          printf '%s\n' "$CI_KEY_PASSPHRASE" | \
            GNUPGHOME="$QBTOS_GNUPGHOME" gpg --batch --yes \
              --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "$QBTOS_GPG_FINGERPRINT" --armor --clearsign \
              --output "dist/$VERSION.sha256" "$unsigned_checksums"
          rm -f "$unsigned_checksums"

          GNUPGHOME="$QBTOS_GNUPGHOME" gpg --batch \
            --verify "dist/$VERSION.sha256"
          (
            cd dist
            GNUPGHOME="$QBTOS_GNUPGHOME" gpg --batch --decrypt \
              "$VERSION.sha256" | sha256sum -c -
          )
          [[ "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4 ]]

      - name: Create moving feed document
        shell: bash
        run: |
          set -euo pipefail
          release_base="${FORGEJO_SERVER_URL%/}/${FORGEJO_REPOSITORY}/releases/download/$SOURCE_TAG"
          ./build-scripts/release-manifest.py \
            --version "$VERSION" --build-date "$BUILD_DATE" --revision "$REVISION" \
            --source-tag "$SOURCE_TAG" --commit "$COMMIT" \
            --bundle "dist/$VERSION.raucb" --image "dist/$VERSION.img.zst" \
            --base-url "$release_base" --output output/latest.json

      - name: Publish Forgejo release and moving feed
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          set -euo pipefail
          ./build-scripts/publish-forgejo-release.sh

      - name: Mirror GitHub release
        shell: bash
        env:
          GH_KEY: ${{ secrets.GH_KEY }}
          GITHUB_REPOSITORY: firebadnofire/qbtos
        run: |
          set -euo pipefail
          ./build-scripts/publish-github-release.sh

      - name: Upload release files
        uses: https://data.forgejo.org/actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/rauc-release.crt" "$RUNNER_TEMP/rauc-release.key"
          rm -f "$RUNNER_TEMP/qbtos-release-gnupg/release-signing-key"
          rm -f "$RUNNER_TEMP/qbtos-update-signing.gpg"
          rm -rf -- "$RUNNER_TEMP/qbtos-release-gnupg"
