image boot.vfat {
	vfat {
		label = "QBTOS_BOOT"
		files = {
			"Image",
			"bcm2711-rpi-4-b.dtb",
			"boot.scr",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start4.elf",
			"u-boot.bin"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
		disk-signature = 0x5142544f
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition system-a {
		partition-type = 0x83
		align = 1M
		image = "rootfs.squashfs"
		size = 96M
	}

	partition system-b {
		partition-type = 0x83
		align = 1M
		image = "rootfs.squashfs"
		size = 96M
	}

	partition state {
		partition-type = 0x83
		align = 1M
		image = "state.ext4"
		size = 512M
	}
}
