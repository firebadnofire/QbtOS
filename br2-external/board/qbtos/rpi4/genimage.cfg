image boot.vfat {
	vfat {
		label = "QBTOS_BOOT"
		files = {
			"Image",
			"bcm2711-rpi-4-b.dtb",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup4.dat",
			"rpi-firmware/overlays",
			"rpi-firmware/start4.elf"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		offset = 1M
		image = "boot.vfat"
	}

	partition system {
		partition-type = 0x83
		align = 1M
		image = "rootfs.squashfs"
	}

	partition config {
		partition-type = 0x83
		align = 1M
		image = "config.ext4"
	}
}
